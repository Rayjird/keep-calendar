<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<title>Keepカレンダー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#23271f; --muted:#6b7064; --line:#dcdfd6;
  --accent:#2f6b4f; --accent-fg:#ffffff; --tint:#e6efe9;
  --f-body:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#171a16; --surface:#21251f; --fg:#e7eae2; --muted:#9aa093; --line:#343a31;
  --accent:#7cc39c; --accent-fg:#10261a; --tint:#22342a; color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) 40px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.4rem;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{font-size:.8rem;color:var(--muted)}
input[type=url]{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:.85rem}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);text-decoration:none;cursor:pointer}
.btn.sub{background:var(--tint);color:var(--accent);font-weight:500;padding:10px}
button:focus-visible,a:focus-visible,input:focus{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Keepカレンダー</h1>

  <div class="card" id="sending" hidden>
    <p>Keepのメモを受け取りました。確認画面を開いています…</p>
    <p class="muted" id="peek"></p>
  </div>

  <div class="card" id="home" hidden>
    <a class="btn" id="open" href="#">カレンダー反映画面を開く</a>
    <p class="muted">Keepでメモを開き、︙ →「送信」→「Keepカレンダー」を選ぶと、中身入りで開きます。</p>
  </div>

  <div class="card" id="setup">
    <label for="exec">Apps Script ウェブアプリのURL（…/exec）</label>
    <input type="url" id="exec" placeholder="https://script.google.com/macros/s/……/exec">
    <button class="btn sub" id="save">保存</button>
    <p class="muted" id="note">最初に1回だけ設定します。URLはこのスマホの中だけに保存されます。</p>
  </div>
</div>

<form id="f" method="post" hidden><input type="hidden" name="text" id="t"></form>

<script>
const $ = id => document.getElementById(id);
const KEY = 'kc-exec';
const getExec = () => { try { return localStorage.getItem(KEY) || ''; } catch(e) { return ''; } };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

function showHome(){
  const exec = getExec();
  $('exec').value = exec;
  $('home').hidden = !exec;
  $('open').href = exec || '#';
}

$('save').onclick = () => {
  const v = $('exec').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)) {
    $('note').textContent = '「https://script.google.com/」で始まり「/exec」で終わるURLを貼ってください。';
    return;
  }
  try { localStorage.setItem(KEY, v); } catch(e) {}
  $('note').textContent = '保存しました。';
  showHome();
};

async function takeShared(){
  if (!new URLSearchParams(location.search).has('share')) return null;
  history.replaceState(null, '', './');
  const c = await caches.open('kc-share');
  const key = new URL('shared-text', location.href).href;
  const r = await c.match(key);
  if (!r) return null;
  await c.delete(key);
  return r.text();
}

(async () => {
  showHome();
  const text = await takeShared();
  const exec = getExec();
  if (text && exec) {
    $('home').hidden = true; $('setup').hidden = true; $('sending').hidden = false;
    $('peek').textContent = text.slice(0, 80) + (text.length > 80 ? '…' : '');
    $('t').value = text;
    $('f').action = exec;
    $('f').submit();
  } else if (text) {
    $('note').textContent = '先にApps ScriptのURLを保存してから、もう一度Keepから送信してください。';
  }
})();
</script>
</body>
</html>
